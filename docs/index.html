<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小米笔记导出助手 · 把小米/红米笔记一键备份到电脑并导出 Word</title>
<meta name="description" content="免费、开源、本地运行的小米/红米笔记导出工具。图形界面扫码登录，增量同步，一键导出 Word，无需命令行，Windows 单文件下载即用。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='15' fill='url(%23g)'/%3E%3Crect x='18' y='14' width='28' height='30' rx='4' fill='%23ffffff'/%3E%3Cpath d='M24 23h16M24 30h16M24 37h10' stroke='%239cc2e8' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M32 38v12m0 0l-5-5m5 5l5-5' stroke='%231565d8' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0e2438;
  --ink-2:#42596e;
  --ink-3:#7b90a3;
  --bg:#ffffff;
  --bg-soft:#f3f8fd;
  --bg-soft2:#eef6fc;
  --line:#e1ecf5;
  --blue:#2f7cf6;
  --blue-deep:#1565d8;
  --cyan:#06b6d4;
  --grad:linear-gradient(135deg,#3b82f6 0%,#0fb5d6 55%,#06b6d4 100%);
  --grad-soft:linear-gradient(135deg,#eaf3ff,#e6fbfd);
  --shadow-sm:0 2px 10px rgba(22,70,120,.06);
  --shadow-md:0 14px 40px -12px rgba(21,101,216,.22);
  --shadow-lg:0 40px 90px -30px rgba(18,90,170,.34);
  --radius:18px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono)}

/* ============ 通用动效 ============ */
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,26px) scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  .orb,.app-window{animation:none!important}
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--sans);font-size:15px;font-weight:600;
  padding:13px 24px;border-radius:999px;border:1px solid transparent;
  cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,background .25s,border-color .25s;
  white-space:nowrap;position:relative;overflow:hidden;
}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 12px 28px -10px rgba(20,120,210,.55)}
.btn-primary::after{content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);
  transition:left .6s ease;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(20,120,210,.6)}
.btn-primary:hover::after{left:130%}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{transform:translateY(-2px);border-color:#bcd6ef;box-shadow:var(--shadow-md)}
.btn-lg{padding:16px 32px;font-size:16px}

/* ============ 导航 ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .3s,box-shadow .3s,border-color .3s;
  border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom-color:var(--line);box-shadow:0 6px 24px -18px rgba(20,80,140,.5)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand-logo{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:0 6px 16px -6px rgba(20,120,210,.6)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a.navlink{font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}
.nav-links a.navlink:hover{color:var(--blue-deep);background:var(--bg-soft)}
.nav-cta{margin-left:8px}
.nav-cta .btn{padding:9px 18px;font-size:14px}
.nav-github{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink-2);
  padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}
.nav-github:hover{color:var(--blue-deep);background:var(--bg-soft)}
.nav-github svg{width:19px;height:19px}
@media(max-width:760px){.nav-links a.navlink{display:none}.brand small{display:none}}

/* ============ HERO ============ */
.hero{position:relative;padding:132px 0 70px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none}
.orb.o1{width:460px;height:460px;background:radial-gradient(circle,#9fd8ff,transparent 70%);top:-120px;left:-120px;animation:drift1 18s ease-in-out infinite}
.orb.o2{width:520px;height:520px;background:radial-gradient(circle,#a6f2ef,transparent 70%);top:-60px;right:-160px;animation:drift2 22s ease-in-out infinite}
.orb.o3{width:360px;height:360px;background:radial-gradient(circle,#cfe0ff,transparent 70%);bottom:-180px;left:40%;animation:drift1 26s ease-in-out infinite}
.hero .container{position:relative;z-index:1;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);
  background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:7px 15px;
  box-shadow:var(--shadow-sm);animation:rise .7s both}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(6,182,212,.18)}
.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.18;font-weight:800;letter-spacing:-.01em;margin:24px 0 18px;
  animation:rise .8s .08s both}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{font-size:clamp(15.5px,2.2vw,19px);color:var(--ink-2);max-width:640px;margin:0 auto 30px;
  animation:rise .8s .16s both}
.hero .sub b{color:var(--ink);font-weight:700}
.cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:rise .8s .24s both}
.hero-meta{display:flex;gap:8px 20px;justify-content:center;flex-wrap:wrap;margin-top:26px;font-size:13px;color:var(--ink-3);
  animation:rise .8s .32s both}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta svg{width:15px;height:15px;color:var(--blue)}

/* ============ 应用窗口 MOCKUP（signature） ============ */
.mock-wrap{position:relative;margin:64px auto 0;max-width:880px;perspective:1600px}
.app-window{
  position:relative;text-align:left;background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:var(--shadow-lg);border:1px solid var(--line);
  animation:rise 1s .4s both,floaty 8s 1.2s ease-in-out infinite;
}
.app-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(180deg,#fbfdff,#f2f8fd);
  border-bottom:1px solid var(--line)}
.app-bar .dots{display:flex;gap:7px}
.app-bar .dots i{width:11px;height:11px;border-radius:3px;background:#d7e6f3}
.app-bar .t{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:7px}
.app-bar .t svg{width:15px;height:15px}
.app-bar .sp{width:38px}
.app-body{padding:22px;
  background:
    radial-gradient(600px 200px at 50% -40px,rgba(64,160,240,.10),transparent 70%),#fff}
.mock-hint{position:absolute;top:-14px;right:18px;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:#fff;background:var(--grad);padding:4px 11px;border-radius:999px;box-shadow:var(--shadow-md);z-index:2}

.mock-screen{display:flex;gap:18px;flex-direction:column}
.mock-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 8px;border-radius:13px;
  border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:all .35s cubic-bezier(.2,.7,.2,1);
  font-family:var(--sans)}
.mbtn .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--grad);
  transition:transform .3s}
.mbtn .ic svg{width:22px;height:22px}
.mbtn .lab{font-size:13px;font-weight:600;color:var(--ink)}
.mbtn .st{font-size:11px;color:var(--ink-3);min-height:14px}
.mbtn:hover{border-color:#9ec8f3;transform:translateY(-3px);box-shadow:var(--shadow-md)}
.mbtn:hover .ic{transform:scale(1.08) rotate(-3deg)}
.mbtn.active{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,124,246,.12)}
.mbtn.done{border-color:#33cda0}
.mbtn.done .ic{background:linear-gradient(135deg,#16b98a,#06b6d4)}
.mbtn.done .st{color:#12a27a;font-weight:600}
.mbtn .spin{width:15px;height:15px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;display:none}
.mbtn.working .ic svg{display:none}
.mbtn.working .ic .spin{display:block}
@media(max-width:560px){.mock-btns{grid-template-columns:1fr;gap:9px}.mbtn{flex-direction:row;text-align:left;padding:12px 14px}
  .mbtn .ic{width:34px;height:34px}.mbtn .st{margin-left:auto}}

.progress-row{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:9px;border-radius:99px;background:#e8f1f9;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);
  background-size:200% 100%;transition:width .5s ease;position:relative}
.progress i.run{animation:barShine 1.4s linear infinite}
@keyframes barShine{0%{background-position:0 0}100%{background-position:200% 0}}
.progress-pct{font-size:12px;font-weight:700;color:var(--blue-deep);min-width:40px;text-align:right;font-family:var(--mono)}

.term{background:#0e2233;border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.85;
  min-height:132px;color:#bfe0f5;overflow:hidden}
.term .ln{white-space:pre-wrap;opacity:0;animation:lnIn .35s forwards}
.term .ok{color:#5fe3b0}
.term .hi{color:#8fd0ff}
.term .warn{color:#ffd479}
.term .cur::after{content:"▍";color:#5fe3b0;animation:blink 1s steps(1) infinite}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}

/* ============ 信任条 ============ */
.trust{margin-top:64px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-soft);
  display:grid;grid-template-columns:repeat(2,1fr);overflow:hidden}
.trust div{display:flex;align-items:center;gap:12px;padding:18px 22px;font-size:14px;font-weight:600;color:var(--ink)}
.trust div:nth-child(odd){border-right:1px solid var(--line)}
.trust div:nth-child(1),.trust div:nth-child(2){border-bottom:1px solid var(--line)}
.trust svg{width:22px;height:22px;color:var(--blue);flex:none}
@media(max-width:640px){.trust{grid-template-columns:1fr}.trust div:nth-child(odd){border-right:none}
  .trust div{border-bottom:1px solid var(--line)!important}.trust div:last-child{border-bottom:none!important}}

/* ============ 区块通用 ============ */
section.block{padding:86px 0;position:relative}
.section-head{max-width:680px;margin:0 auto 52px;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue-deep);
  background:var(--bg-soft);border:1px solid var(--line);padding:6px 14px;border-radius:999px;margin-bottom:18px}
.kicker svg{width:14px;height:14px}
.section-head h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:14px}
.section-head p{color:var(--ink-2);font-size:16px}

/* ============ 特性 ============ */
.features{background:var(--bg-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.fcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;overflow:hidden}
.fcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);
  transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
.fcard:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);border-color:#c8e1f7}
.fcard:hover::before{transform:scaleX(1)}
.fnum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.08em}
.fcard .fico{width:48px;height:48px;border-radius:13px;background:var(--grad-soft);border:1px solid var(--line);
  display:grid;place-items:center;margin:14px 0 16px;color:var(--blue-deep);transition:transform .35s}
.fcard:hover .fico{transform:rotate(-6deg) scale(1.06)}
.fcard .fico svg{width:25px;height:25px}
.fcard h3{font-size:19px;font-weight:700;margin-bottom:9px}
.fcard p{font-size:14.5px;color:var(--ink-2)}
@media(max-width:760px){.fgrid{grid-template-columns:1fr;gap:14px}}

/* ============ 三步流程 ============ */
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:step}
.step{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px}
.step .snum{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:19px;
  display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(20,120,210,.55);margin-bottom:16px}
.step h3{font-size:17px;font-weight:700;margin-bottom:8px}
.step p{font-size:14px;color:var(--ink-2)}
.step:not(:last-child)::after{content:"";position:absolute;top:50px;right:-15px;width:30px;height:2px;
  background:linear-gradient(90deg,#9ec8f3,transparent);z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;top:45px;right:-12px;z-index:2;
  border:6px solid transparent;border-left-color:#9ec8f3}
@media(max-width:860px){.steps-grid{grid-template-columns:1fr}.step:not(:last-child)::after,.step:not(:last-child)::before{display:none}}

/* ============ 下载区 ============ */
.download{background:linear-gradient(180deg,#eef7fe,#f7fbff 60%,#fff)}
.dl-card{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lg);overflow:hidden}
.dl-top{display:flex;align-items:center;gap:20px;padding:30px;flex-wrap:wrap;
  background:linear-gradient(120deg,#f2f9ff,#e9fbfd)}
.dl-logo{width:66px;height:66px;border-radius:16px;flex:none;box-shadow:0 14px 30px -12px rgba(20,120,210,.6)}
.dl-top .info{flex:1;min-width:200px}
.dl-top .info h3{font-size:21px;font-weight:800px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.win-tag{font-size:11px;font-weight:700;color:#fff;background:var(--grad);padding:3px 10px;border-radius:999px}
.dl-top .info p{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.dl-top .dl-actions{display:flex;flex-direction:column;gap:10px}
.dl-body{padding:8px 30px 26px}
.dl-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);padding:12px 0;border-bottom:1px dashed var(--line)}
.dl-row:last-child{border-bottom:none}
.dl-row svg{width:18px;height:18px;color:var(--blue);flex:none}
.dl-row .mono{color:var(--ink);font-size:12.5px;word-break:break-all}
.copy-hash{margin-left:auto;font-size:12px;font-weight:600;color:var(--blue-deep);border:1px solid var(--line);
  background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;transition:all .2s;font-family:var(--sans);flex:none}
.copy-hash:hover{background:var(--bg-soft);border-color:#9ec8f3}
.dl-extra{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.smartscreen{max-width:760px;margin:22px auto 0;border:1px solid #ffe4b3;background:#fffaf0;border-radius:14px;padding:18px 22px}
.smartscreen h4{font-size:14.5px;font-weight:700;color:#b4681a;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.smartscreen h4 svg{width:18px;height:18px}
.smartscreen ol{margin:0 0 0 18px;font-size:13.5px;color:#7a5520}
.smartscreen li{margin:4px 0}
.smartscreen code{background:#fff;border:1px solid #f0ddbb;border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:12.5px}

/* ============ 声明 ============ */
.legal{background:#0e2438;color:#c9d9e8;padding:84px 0 40px}
.legal .section-head h2{color:#fff}
.legal .section-head p{color:#9db6cc}
.legal .kicker{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#8fd0ff}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.lcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px}
.lcard h3{font-size:16px;font-weight:700;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.lcard h3 svg{width:19px;height:19px;color:#5fd0e8;flex:none}
.lcard p,.lcard li{font-size:13.8px;line-height:1.85;color:#a9c0d5}
.lcard ul{margin-left:18px}
.lcard li{margin:5px 0}
.lcard .em{color:#ffd479}
@media(max-width:760px){.lgrid{grid-template-columns:1fr;gap:14px}}

/* ============ 页脚 ============ */
.footer{background:#0a1c2d;padding:40px 0;border-top:1px solid rgba(255,255,255,.08)}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.footer .brand{color:#fff}
.footer .brand small{color:#7d98b0}
.footer .mail{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:#cfe6f7;
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:11px 20px;transition:all .25s}
.footer .mail:hover{border-color:#5fd0e8;color:#fff;box-shadow:0 0 0 4px rgba(95,208,232,.12)}
.footer .mail svg{width:18px;height:18px}
.footer-links{display:flex;gap:16px;align-items:center;margin-top:16px;font-size:13px;color:#7d98b0;width:100%}
.footer-links a{color:#9db6cc;transition:color .2s}
.footer-links a:hover{color:#fff}
.footer-links .sep{opacity:.4}
@media(max-width:640px){.footer-inner{flex-direction:column;align-items:flex-start;gap:14px}}
</style>
</head>
<body>
<!-- ===== 导航 ===== -->
<nav class="nav" id="nav">
  <div class="container nav-inner">
